[package]
name = "katsu-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Measures JavaScript runtimes against each other on cold start, memory, distribution size and throughput, and publishes the losses next to the wins."
license = "MIT OR Apache-2.0"
repository = "https://github.com/tamnd/katsu-bench"
publish = false

[[bin]]
name = "katsu-bench"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"

[lints.rust]
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
opt-level = 2
